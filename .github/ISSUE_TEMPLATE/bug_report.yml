name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy an image in Preview
        2. Open the shelf
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipsy version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you copied from or pasted into
      description: Leave empty if it does not matter.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Do not include anything private from your clipboard.
