excluded:
  - .build
  - DerivedData
  - build
  - research

# formatting is SwiftFormat's job
disabled_rules:
  - trailing_comma
  - opening_brace
  - line_length
  - todo

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - multiline_parameters
  - no_extension_access_modifier
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition

custom_rules:
  no_print:
    name: No print
    regex: '(?<![\w.])(print|debugPrint|dump|NSLog)\('
    message: "Use os.Logger with privacy annotations; never log clipboard content."
    severity: error
  no_dispatch_queue:
    name: No DispatchQueue
    regex: 'DispatchQueue\.(main|global)'
    message: "Use Swift concurrency (@MainActor, Task, actors) instead of GCD."
    severity: warning

function_body_length:
  warning: 60
  error: 100
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 500
  error: 800
cyclomatic_complexity:
  warning: 10
  error: 20
nesting:
  type_level: 2
identifier_name:
  excluded: [id, x, y, i, to, at]
